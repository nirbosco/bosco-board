<title>לוּחַ בּוֹסְקוֹ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&display=swap">
<script type="application/json" id="state">{"tasks":[],"songs":[],"rev":1}</script>
<style>
  :root {
    --paper: #fcfcf9;
    --ink: #191914;
    --faint: #8a8a80;
    --hairline: #b9b9ae;
    --shade: #f1f0e9;
  }
  body.dark {
    --paper: #191914;
    --ink: #ece9df;
    --faint: #8f8d83;
    --hairline: #45453e;
    --shade: #23231d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Frank Ruhl Libre', 'David Libre', 'Times New Roman', serif;
    direction: rtl;
    overflow: hidden;
  }
  #board {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  /* ---- right pane: date, clock, tasks ---- */
  #now-pane {
    flex: 11;
    display: flex;
    flex-direction: column;
    padding: 3.5vmin 4vmin 3vmin 3vmin;
    border-left: 1px solid var(--hairline);
    min-width: 0;
  }
  #date-line {
    font-size: 3.4vmin;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  #clock {
    font-size: 12vmin;
    line-height: 1.18;
    font-weight: 900;
    margin-top: 1.2vmin;
    text-wrap: balance;
  }
  /* letter-level clock transitions */
  .w { display: inline-block; }
  .g { display: inline-block; }
  .g.out { animation: g-out 0.42s cubic-bezier(0.5, 0, 0.8, 0.4) forwards; }
  .g.in { animation: g-in 0.6s cubic-bezier(0.15, 0.6, 0.2, 1) backwards; }
  @keyframes g-out {
    to { opacity: 0; transform: translateY(-0.16em); filter: blur(3px); }
  }
  @keyframes g-in {
    from { opacity: 0; transform: translateY(0.18em); filter: blur(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .g.out, .g.in { animation: none; }
  }
  #tasks-block {
    margin-top: auto;
    padding-top: 2vmin;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: 58%;
  }
  #tasks-title {
    font-size: 4vmin;
    font-weight: 700;
    margin-bottom: 1.6vmin;
  }
  #task-list {
    list-style: none;
    overflow-y: auto;
    min-height: 0;
  }
  .task {
    display: flex;
    align-items: baseline;
    gap: 1.6vmin;
    padding: 1vmin 0;
    font-size: 3.5vmin;
    font-weight: 500;
  }
  .task .dot {
    flex: none;
    width: 3vmin; height: 3vmin;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    align-self: center;
    padding: 0;
  }
  .task.done .dot { background: var(--ink); }
  .task.done .txt { text-decoration: line-through; color: var(--faint); }
  .task .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task .del {
    flex: none;
    border: 0; background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 2.4vmin;
    cursor: pointer;
    visibility: hidden;
    align-self: center;
  }
  .task.done .del { visibility: visible; }
  #add-row {
    display: flex;
    gap: 1.2vmin;
    align-items: center;
    padding-top: 1.4vmin;
    margin-top: 0.6vmin;
    border-top: 1px solid var(--hairline);
  }
  #add-row select, #add-row input, #add-row button {
    font-family: inherit;
    font-size: 3.1vmin;
    color: var(--ink);
    background: var(--paper);
    border: 0;
  }
  #add-row select {
    border-bottom: 1px solid var(--hairline);
    padding: 0.4vmin 0;
  }
  #add-row input {
    flex: 1;
    min-width: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 0.4vmin 0.2vmin;
  }
  #add-row input:focus, #add-row select:focus { outline: none; border-bottom-color: var(--ink); }
  #add-row button {
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    width: 4.6vmin; height: 4.6vmin;
    line-height: 1;
    font-size: 3vmin;
    font-weight: 500;
    cursor: pointer;
  }
  #add-row button:focus-visible, .dot:focus-visible, .del:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* ---- song of the day ---- */
  #song-block { margin-top: 2.4vmin; }
  #song-row { display: flex; align-items: center; gap: 1.8vmin; }
  #play-song {
    width: 7vmin; height: 7vmin;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    font-size: 3vmin;
    cursor: pointer;
    padding-right: 0.6vmin; /* optical centering of the triangle */
  }
  #play-song:active { background: var(--ink); color: var(--paper); }
  #song-label { font-size: 3.5vmin; font-weight: 700; }
  #manage-songs {
    border: 0; background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 3.2vmin;
    cursor: pointer;
    margin-right: auto;
  }
  #play-song:focus-visible, #manage-songs:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #song-manager { margin-top: 1vmin; }
  #song-list { list-style: none; max-height: 18vmin; overflow-y: auto; }
  #song-list li {
    display: flex; align-items: center; gap: 1.2vmin;
    font-size: 2.8vmin; padding: 0.4vmin 0; color: var(--ink);
  }
  #song-list .del-song {
    border: 0; background: none; color: var(--faint);
    font-family: inherit; font-size: 2.2vmin; cursor: pointer;
  }
  #add-song { display: flex; gap: 1.2vmin; align-items: center; margin-top: 0.6vmin; }
  #add-song input {
    font-family: inherit; font-size: 2.2vmin; color: var(--ink);
    background: var(--paper); border: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 0.3vmin 0.2vmin; min-width: 0;
  }
  #add-song #song-url { flex: 3; direction: ltr; text-align: left; }
  #add-song #song-name { flex: 2; }
  #add-song button {
    font-family: inherit; font-size: 2.6vmin; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 50%; width: 3.4vmin; height: 3.4vmin; line-height: 1; cursor: pointer;
  }
  #add-song input:focus { outline: none; border-bottom-color: var(--ink); }
  #note {
    font-size: 2.3vmin;
    color: var(--faint);
    margin-top: 1vmin;
    min-height: 2.4vmin;
  }
  /* ---- hidden background player ---- */
  #bg-player-shell {
    position: fixed; bottom: 0; left: 0;
    width: 2px; height: 2px;
    opacity: 0.01;
    overflow: hidden;
    pointer-events: none;
  }
  #now-playing-row {
    display: flex;
    align-items: center;
    gap: 2vmin;
    margin-top: 1.2vmin;
    min-height: 4.5vmin;
  }
  #now-playing { font-size: 2.7vmin; font-weight: 500; color: var(--ink); }
  #pause-song {
    font-family: inherit;
    font-size: 2.5vmin;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 0.4vmin 2vmin;
    cursor: pointer;
  }
  #pause-song:active { background: var(--ink); color: var(--paper); }
  #pause-song:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* ---- left pane: schedule ---- */
  #schedule-pane {
    flex: 14;
    padding: 3.5vmin 3vmin 1.5vmin;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  /* weekly slider */
  #slider {
    flex: 1;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    min-height: 0;
  }
  #slider::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    min-width: 0;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
  }
  .weekly-title {
    font-size: 3.5vmin;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.2vmin;
  }
  .weekly-wrap { flex: 1; min-height: 0; display: flex; }
  table.weekly {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .weekly th, .weekly td {
    border: 1px solid var(--hairline);
    text-align: center;
    vertical-align: middle;
    font-size: 2.3vmin;
    font-weight: 500;
    padding: 0.6vmin 0.2vmin;
    overflow: hidden;
  }
  .weekly th { font-size: 2.5vmin; font-weight: 700; }
  .weekly .hr { width: 8%; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 400; }
  .weekly .today-col { background: var(--shade); }
  .weekly .act-time {
    display: block;
    font-size: 1.9vmin;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  .weekly-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hairline);
    color: var(--faint);
    font-size: 3.3vmin;
    text-align: center;
    padding: 2vmin;
  }
  #slider-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.4vmin;
    padding-top: 1vmin;
  }
  #slider-nav button {
    border: 0;
    background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 3.6vmin;
    line-height: 1;
    cursor: pointer;
    padding: 0 1vmin;
  }
  #slider-nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #slider-dots { display: flex; gap: 1.4vmin; }
  .sdot {
    width: 1.3vmin; height: 1.3vmin;
    border: 1px solid var(--faint);
    border-radius: 50%;
  }
  .sdot.on { background: var(--ink); border-color: var(--ink); }
  #schedule {
    flex: 1;
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  #schedule th, #schedule td {
    border: 1px solid var(--hairline);
    text-align: center;
    vertical-align: middle;
    padding: 0.7vmin 0.5vmin;
    font-size: 3vmin;
    font-weight: 500;
    overflow: hidden;
  }
  #schedule th {
    font-size: 3.5vmin;
    font-weight: 700;
    padding: 1vmin 0.5vmin;
  }
  #schedule .hourcol {
    width: 24%;
    font-weight: 400;
  }
  #schedule .hourcol .hname { display: block; font-weight: 500; }
  #schedule .hourcol .htime {
    display: block;
    font-size: 2.3vmin;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  #schedule tr.break td { background: var(--shade); font-size: 2.5vmin; padding: 0.4vmin; }
  #schedule tr.after td { height: 16%; font-weight: 400; color: var(--faint); }
  #schedule td.special-cell {
    font-size: 2.9vmin;
    font-weight: 500;
    line-height: 2;
    padding: 1.5vmin;
    vertical-align: middle;
  }
  #schedule .act-name { display: block; color: var(--ink); font-weight: 500; }
  #schedule .act-time {
    display: block;
    font-size: 2.3vmin;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  #schedule td.empty { color: var(--faint); }
  #offday {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
    border: 1px solid var(--hairline);
  }
  #offday-word { font-size: 11vmin; font-weight: 900; }
  #offday-sub { font-size: 3.6vmin; font-weight: 400; color: var(--faint); }
  /* portrait / phone: stacked, scrollable, sized by width */
  @media (orientation: portrait) {
    html, body { height: auto; }
    body { overflow: auto; }
    #board { flex-direction: column; height: auto; min-height: 100vh; width: auto; }
    #now-pane {
      border-left: 0;
      border-bottom: 1px solid var(--hairline);
      padding: 5vw 5vw 6vw;
    }
    #date-line { font-size: 4.2vw; }
    #clock { font-size: 12vw; }
    #song-block { margin-top: 5vw; }
    #song-row { gap: 3vw; }
    #play-song { width: 11vw; height: 11vw; font-size: 4.6vw; padding-right: 1vw; }
    #song-label { font-size: 5vw; }
    #manage-songs { font-size: 5.5vw; }
    #song-manager { margin-top: 2vw; }
    #song-list { max-height: 34vw; }
    #song-list li { font-size: 4vw; gap: 2vw; padding: 1vw 0; }
    #song-list .del-song { font-size: 4vw; }
    #add-song { gap: 2vw; margin-top: 1.5vw; }
    #add-song input { font-size: 4vw; padding: 0.8vw 0.4vw; }
    #add-song button { font-size: 4.6vw; width: 6.5vw; height: 6.5vw; }
    #tasks-block { max-height: none; margin-top: 7vw; padding-top: 0; }
    #tasks-title { font-size: 5.5vw; margin-bottom: 2.5vw; }
    #task-list { overflow-y: visible; }
    .task { font-size: 4.6vw; gap: 3vw; padding: 1.6vw 0; }
    .task .dot { width: 4.4vw; height: 4.4vw; }
    .task .del { font-size: 4vw; }
    #add-row { gap: 2.5vw; padding-top: 2.5vw; }
    #add-row select, #add-row input { font-size: 4.2vw; padding: 0.8vw 0.4vw; }
    #add-row button { width: 7.5vw; height: 7.5vw; font-size: 5.5vw; }
    #note { font-size: 3.4vw; min-height: 4.5vw; }
    #schedule-pane { padding: 5vw 4vw 6vw; }
    #schedule th { font-size: 4.6vw; padding: 2vw 1vw; }
    #schedule th.hourcol, #schedule td.hourcol { width: 28%; }
    #schedule td { font-size: 3.9vw; padding: 1.8vw 1vw; }
    #schedule .hourcol .htime { font-size: 3vw; }
    #schedule tr.break td { font-size: 3.2vw; padding: 1.2vw 1vw; }
    #schedule tr.after td { height: auto; padding: 4vw 1vw; }
    #offday { min-height: 60vw; }
    #offday-word { font-size: 14vw; }
    #offday-sub { font-size: 4.4vw; }
    .weekly-title { font-size: 5vw; margin-bottom: 2vw; }
    .weekly th, .weekly td { font-size: 2.9vw; padding: 1.2vw 0.4vw; }
    .weekly th { font-size: 3.2vw; }
    .weekly .hr { font-size: 2.4vw; }
    .weekly-empty { min-height: 50vw; font-size: 4.4vw; }
    #slider-nav { gap: 5vw; padding-top: 2.5vw; }
    #slider-nav button { font-size: 7vw; }
    .sdot { width: 2.4vw; height: 2.4vw; }
    #now-playing-row { min-height: 7vw; gap: 3vw; }
    #now-playing { font-size: 4.2vw; }
    #pause-song { font-size: 4vw; padding: 1vw 3.5vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .task .dot { transition: background 0.15s; }
  }
</style>

<div id="board">
  <main id="now-pane">
    <div id="date-line">—</div>
    <div id="clock">—</div>
    <section id="song-block">
      <div id="song-row">
        <button id="play-song" aria-label="נגינת שיר אקראי מרשימת שיר היום">▶</button>
        <span id="song-label">שִׁיר הַיּוֹם</span>
        <button id="manage-songs" aria-label="ניהול רשימת השירים">+</button>
      </div>
      <div id="now-playing-row">
        <span id="now-playing"></span>
        <button id="pause-song" type="button" hidden>הַפְסָקָה</button>
      </div>
      <div id="song-manager" hidden>
        <ul id="song-list"></ul>
        <form id="add-song">
          <input id="song-url" type="url" placeholder="הדביקו קישור יוטיוב" aria-label="קישור יוטיוב" required>
          <input id="song-name" type="text" placeholder="שם השיר" aria-label="שם השיר" maxlength="60">
          <button type="submit" aria-label="הוספת שיר">+</button>
        </form>
      </div>
    </section>
    <section id="tasks-block">
      <div id="tasks-title">מְשִׂימוֹת לְהַיּוֹם:</div>
      <ul id="task-list"></ul>
      <form id="add-row">
        <select id="who" aria-label="מי">
          <option>גולי</option>
          <option>אורי</option>
          <option>שי</option>
          <option>אמא</option>
          <option>אבא</option>
          <option>כולם</option>
        </select>
        <input id="what" type="text" placeholder="משימה חדשה" aria-label="משימה חדשה" maxlength="80">
        <button type="submit" aria-label="הוספת משימה">+</button>
      </form>
      <div id="note"></div>
    </section>
  </main>
  <aside id="schedule-pane">
    <div id="slider">
      <section class="slide" id="slide-guli">
        <div class="weekly-title">הַשָּׁבוּעַ שֶׁל גּוֹלִי</div>
        <div class="weekly-wrap" id="weekly-guli"></div>
      </section>
      <section class="slide" id="slide-today">
        <table id="schedule" aria-label="מערכת השעות של היום">
          <thead>
            <tr><th style="width:38%">גּוֹלִי</th><th class="hourcol">שָׁעָה</th><th style="width:38%">אוֹרִי</th></tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
        <div id="offday"><div id="offday-word">—</div><div id="offday-sub"></div></div>
      </section>
      <section class="slide" id="slide-ori">
        <div class="weekly-title">הַשָּׁבוּעַ שֶׁל אוֹרִי</div>
        <div class="weekly-wrap" id="weekly-ori"></div>
      </section>
    </div>
    <div id="slider-nav">
      <button id="nav-right" aria-label="הַשָּׁבוּעַ שֶׁל גּוֹלִי">›</button>
      <div id="slider-dots"><span class="sdot" data-i="0"></span><span class="sdot on" data-i="1"></span><span class="sdot" data-i="2"></span></div>
      <button id="nav-left" aria-label="הַשָּׁבוּעַ שֶׁל אוֹרִי">‹</button>
    </div>
  </aside>
</div>

<div id="bg-player-shell" aria-hidden="true"><div id="bg-player"></div></div>

      var hm = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
      if (hm === WAKE_TIME) {
        lastWakeDate = iso(now);
        stopPlayback();
        playQueue = [{ videoId: WAKE_VIDEO_ID, title: "שִׁיר הַבֹּקֶר" }];
        queueIdx = 0;
        startBackgroundPlay(playQueue[0]);
      }
    }
    var ds = iso(now);
    if (ds !== shownDate) {
      shownDate = ds;
      setPhrase(document.getElementById("date-line"), dateInWords(now));
      renderSchedule(now);
      renderTasks(); // the built-in ritalin row resets each school day
      buildWeekly("weekly-guli", GULI, AFTERNOON.guli, "");
      buildWeekly("weekly-ori", ORI, AFTERNOON.ori, "הַמַּעֲרֶכֶת שֶׁל אוֹרִי תַּעֲלֶה לַלּוּחַ בְּקָרוֹב");
    }
  }

  function scheduleTick() {
    var now = new Date();
    var delay = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 40;
    setTimeout(function () { tick(); scheduleTick(); }, delay);
  }

  /* ---------- state: artifact self-publish on claude.ai, Supabase on the public site ---------- */
  var IS_ARTIFACT = !!(window.claude && window.claude.use);
  var LS_KEY = "bosco-board-state";
  var SB_URL = "https://ndrhiikczkbosentclnh.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kcmhpaWtjemtib3NlbnRjbG5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzYwMzcsImV4cCI6MjA5NTkxMjAzN30.KpSEtEHI-i2TQDfuCf8l4Dg1wQ-Ya-UdLEQ6VN3KxEQ"; // anon/public key, injected at deploy
  var SB_ON = !IS_ARTIFACT && SB_KEY.indexOf("__") !== 0;
  var BOARD_ID = "bosco-home";
  var state = JSON.parse(document.getElementById("state").textContent);
  if (!IS_ARTIFACT) {
    try {
      var saved = localStorage.getItem(LS_KEY);
      if (saved) state = JSON.parse(saved);
    } catch (e) { /* localStorage unavailable: keep embedded default */ }
  }
  var artifactNS = null;
  var canWrite = true;

  function normalizeState(s) {
    s = s && typeof s === "object" ? s : {};
    s.tasks = s.tasks || [];
    s.songs = s.songs || [];
    s.rev = s.rev || 1;
    return s;
  }
  state = normalizeState(state);

  function sbHeaders(extra) {
    var h = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function cloudPull() {
    return fetch(SB_URL + "/rest/v1/bosco_board?id=eq." + BOARD_ID + "&select=state", { headers: sbHeaders() })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("pull " + r.status)); })
      .then(function (rows) { return rows[0] ? normalizeState(rows[0].state) : null; });
  }
  function cloudPush() {
    return fetch(SB_URL + "/rest/v1/bosco_board?id=eq." + BOARD_ID, {
      method: "PATCH",
      headers: sbHeaders({ Prefer: "return=minimal" }),
      body: JSON.stringify({ state: state, updated_at: new Date().toISOString() })
    }).then(function (r) { if (!r.ok) throw new Error("push " + r.status); note(""); })
      .catch(function () { note("אין חיבור לענן כרגע. השינוי שמור במכשיר הזה ויעלה כשהחיבור יחזור."); });
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* private mode etc. */ }
  }
  function adoptRemote(remote) {
    state = remote;
    saveLocal();
    renderTasks();
    renderSongs();
  }
  function cloudInit() {
    cloudPull().then(function (remote) {
      if (!remote) { state.rev++; cloudPush(); return; }
      var localHas = state.tasks.length || state.songs.length;
      var remoteHas = remote.tasks.length || remote.songs.length;
      if (!remoteHas && localHas) { state.rev = remote.rev + 1; cloudPush(); } // first device migrates its data up
      else if (JSON.stringify(remote) !== JSON.stringify(state)) adoptRemote(remote);
    }).catch(function () { /* offline: stay local */ });
    setInterval(function () {
      if (publishTimer) return; // a local edit is about to be pushed
      cloudPull().then(function (remote) {
        if (remote && remote.rev !== state.rev) adoptRemote(remote);
      }).catch(function () { /* offline */ });
    }, 15000);
  }

  function ritalinRow() {
    var now = new Date();
    if (schoolStatus(now)) return ""; // only on school days
    var done = state.builtin && state.builtin.date === iso(now) && state.builtin.ritalinDone;
    return "<li class='task" + (done ? " done" : "") + "' data-builtin='ritalin'>" +
      "<button class='dot' aria-label='סימון ביצוע'></button>" +
      "<span class='txt'>גולי - לקחת רטלין</span></li>";
  }

  function renderTasks() {
    var ul = document.getElementById("task-list");
    ul.innerHTML = ritalinRow() + state.tasks.map(function (t) {
      return "<li class='task" + (t.done ? " done" : "") + "' data-id='" + t.id + "'>" +
        "<button class='dot' aria-label='סימון ביצוע'></button>" +
        "<span class='txt'>" + esc(t.who) + " - " + esc(t.text) + "</span>" +
        "<button class='del' aria-label='מחיקה'>✕</button></li>";
    }).join("");
  }

  function note(msg) { document.getElementById("note").textContent = msg || ""; }

  var publishTimer = null;
  function schedulePublish() {
    if (publishTimer) clearTimeout(publishTimer);
    publishTimer = setTimeout(doPublish, 900);
  }
  function doPublish() {
    publishTimer = null;
    if (!IS_ARTIFACT) {
      state.rev = (state.rev || 0) + 1;
      saveLocal();
      if (SB_ON) cloudPush();
      return;
    }
    if (!PRISTINE) return;
    if (!artifactNS) { note("השינוי נשמר רק במסך הזה. פתחו את הלוח מחשבון עם הרשאת עריכה כדי לשמור לכולם."); return; }
    state.rev = (state.rev || 0) + 1;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var doc = PRISTINE.replace(/<script type="application\/json" id="state">[\s\S]*?<\/script>/,
      function () { return '<script type="application/json" id="state">' + json + "<\/script>"; });
    artifactNS.publish("<!DOCTYPE html>\n" + doc).catch(function (e) {
      if (e && e.code === "conflict") return; // someone else published; view reloads to the winner
      canWrite = false;
      note("אין הרשאת שמירה מהמכשיר הזה. השינוי נשאר רק במסך הזה.");
    });
  }

  document.getElementById("task-list").addEventListener("click", function (ev) {
    var li = ev.target.closest(".task");
    if (!li) return;
    if (li.getAttribute("data-builtin") === "ritalin") {
      if (!ev.target.classList.contains("dot")) return;
      var today = iso(new Date());
      var cur = state.builtin && state.builtin.date === today && state.builtin.ritalinDone;
      state.builtin = { date: today, ritalinDone: !cur };
      renderTasks(); schedulePublish();
      return;
    }
    var id = Number(li.getAttribute("data-id"));
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    if (ev.target.classList.contains("dot")) { t.done = !t.done; renderTasks(); schedulePublish(); }
    if (ev.target.classList.contains("del")) {
      state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
      renderTasks(); schedulePublish();
    }
  });

  document.getElementById("add-row").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("what");
    var text = input.value.trim();
    if (!text) return;
    var who = document.getElementById("who").value;
    var maxId = state.tasks.reduce(function (m, t) { return Math.max(m, t.id); }, 0);
    state.tasks.push({ id: maxId + 1, who: who, text: text, done: false });
    input.value = "";
    renderTasks(); schedulePublish();
  });

  /* ---------- song of the day ---------- */
  state.songs = state.songs || [];
  var lastPlayedId = null;

  function ytId(url) {
    var m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function renderSongs() {
    var ul = document.getElementById("song-list");
    ul.innerHTML = state.songs.length
      ? state.songs.map(function (s) {
          return "<li data-id='" + s.id + "'><button class='del-song' aria-label='הסרת שיר'>✕</button><span>" + esc(s.title) + "</span></li>";
        }).join("")
      : "<li>הרשימה ריקה. הדביקו למטה קישור יוטיוב.</li>";
  }

  /* ---------- hidden background player: one drawn song per day ---------- */
  var ytPlayer = null, ytReady = false, isPlaying = false, ytApiRequested = false, pendingSong = null;
  var playQueue = [], queueIdx = 0;
  var WAKE_VIDEO_ID = "__WAKE_ID__"; // Nir's 07:35 wake-up song
  var WAKE_TIME = "07:35";
  var lastWakeDate = "";
  var SHEET_CSV_URL = "__SHEET_URL__"; // published-to-web CSV of the family song sheet
  var SHEET_ON = SHEET_CSV_URL.indexOf("http") === 0;
  var sheetSongs = null;

  function songsList() { return SHEET_ON ? (sheetSongs || []) : state.songs; }

  function parseCsvSongs(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var parts = line.split(",").map(function (c) { return c.replace(/^"+|"+$/g, "").trim(); });
      var link = null;
      for (var i = 0; i < parts.length; i++) if (/youtu/.test(parts[i])) { link = parts[i]; break; }
      if (!link) return;
      var vid = ytId(link);
      if (!vid) return;
      var title = "";
      for (var j = 0; j < parts.length; j++) if (parts[j] && !/youtu/.test(parts[j])) { title = parts[j]; break; }
      out.push({ id: out.length + 1, videoId: vid, title: title || ("שיר " + (out.length + 1)) });
    });
    return out;
  }

  function refreshSheet() {
    if (!SHEET_ON) return;
    fetch(SHEET_CSV_URL, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
      .then(function (t) {
        var songs = parseCsvSongs(t);
        if (songs.length) {
          sheetSongs = songs;
          try { localStorage.setItem("bosco-sheet-songs", JSON.stringify(songs)); } catch (e) { }
        }
      })
      .catch(function () {
        if (!sheetSongs) {
          try { sheetSongs = JSON.parse(localStorage.getItem("bosco-sheet-songs") || "null"); } catch (e) { }
        }
      });
  }

  function setPauseButton(mode) { // "playing" | "paused" | null
    var b = document.getElementById("pause-song");
    if (!mode) { b.hidden = true; return; }
    b.hidden = false;
    b.textContent = mode === "paused" ? "הַמְשֵׁךְ" : "הַפְסָקָה";
  }

  function nowPlaying(text) { document.getElementById("now-playing").textContent = text || ""; }

  function stopPlayback() {
    isPlaying = false;
    playQueue = [];
    queueIdx = 0;
    nowPlaying("");
    setPauseButton(null);
    if (ytPlayer && ytReady) { try { ytPlayer.stopVideo(); } catch (e) { /* not ready */ } }
  }

  function advanceQueue() {
    queueIdx++;
    if (queueIdx < playQueue.length) {
      var next = playQueue[queueIdx];
      isPlaying = true;
      nowPlaying("מְנַגֵּן עַכְשָׁו: " + next.title);
      setPauseButton("playing");
      pendingSong = next;
      if (ytPlayer && ytReady) { ytPlayer.loadVideoById(next.videoId); nudgePlay(); }
      // not ready yet: onReady loads pendingSong itself
    } else {
      stopPlayback();
    }
  }

  function nudgePlay() { // some browsers cue instead of playing after a programmatic load
    setTimeout(function () {
      try { if (isPlaying && ytPlayer && ytReady && ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); } catch (e) { }
    }, 1500);
  }

  // the label follows what actually plays, not what we intended to play
  function syncLabelToPlayer() {
    try {
      var vd = ytPlayer.getVideoData() || {};
      if (!vd.video_id) return;
      var match = null;
      for (var k = 0; k < playQueue.length; k++) {
        if (playQueue[k].videoId === vd.video_id) { match = playQueue[k]; queueIdx = k; break; }
      }
      nowPlaying("מְנַגֵּן עַכְשָׁו: " + (match ? match.title : (vd.title || "")));
    } catch (e) { /* player mid-transition */ }
  }

  function startBackgroundPlay(song) {
    pendingSong = song;
    isPlaying = true;
    nowPlaying("מְנַגֵּן עַכְשָׁו: " + song.title);
    setPauseButton("playing");
    if (ytPlayer && ytReady) { ytPlayer.loadVideoById(song.videoId); return; }
    if (ytApiRequested) return;
    ytApiRequested = true;
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("bg-player", {
        width: "2", height: "2",
        videoId: pendingSong.videoId,
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0 },
        events: {
          onReady: function (e) {
            ytReady = true;
            if (isPlaying && pendingSong) { e.target.loadVideoById(pendingSong.videoId); nudgePlay(); }
          },
          onStateChange: function (e) {
            if (!window.YT) return;
            if (e.data === YT.PlayerState.ENDED) advanceQueue();
            else if (e.data === YT.PlayerState.CUED && isPlaying) e.target.playVideo();
            else if (e.data === YT.PlayerState.PAUSED && isPlaying) setPauseButton("paused");
            else if (e.data === YT.PlayerState.PLAYING) { setPauseButton("playing"); syncLabelToPlayer(); }
          },
          onError: function () { advanceQueue(); } // unplayable song: move on to the next
        }
      });
    };
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = function () { stopPlayback(); note("אין גישה ליוטיוב כרגע."); };
    document.head.appendChild(tag);
  }

  function playDaily() {
    if (isPlaying) return; // no skipping, no restarting mid-song
    var today = iso(new Date());
    var list = songsList();
    var pick = null;
    if (state.daily && state.daily.date === today && state.daily.videoId) {
      pick = { videoId: state.daily.videoId, title: state.daily.title || "שיר היום" };
    }
    if (!pick) { // first press today draws the song for the whole family
      if (!list.length) {
        if (SHEET_ON) { note("רשימת השירים בגוגל שיטס ריקה או לא זמינה."); }
        else {
          document.getElementById("song-manager").hidden = false;
          note("עוד אין שירים ברשימה. הוסיפו קישור יוטיוב ולחצו שוב על פליי.");
        }
        return;
      }
      var s0 = list[Math.floor(Math.random() * list.length)];
      pick = { videoId: s0.videoId, title: s0.title };
      state.daily = { date: today, videoId: pick.videoId, title: pick.title };
      schedulePublish();
    }
    // the daily song opens; the rest of the list follows in order
    var rest = list.filter(function (x) { return x.videoId !== pick.videoId; })
      .map(function (x) { return { videoId: x.videoId, title: x.title }; });
    playQueue = [pick].concat(rest);
    queueIdx = 0;
    startBackgroundPlay(pick);
  }

  document.getElementById("pause-song").addEventListener("click", function () {
    if (!isPlaying || !ytPlayer || !ytReady) return;
    try {
      if (ytPlayer.getPlayerState() === YT.PlayerState.PAUSED) ytPlayer.playVideo();
      else ytPlayer.pauseVideo();
    } catch (e) { /* player not ready */ }
  });

  // click plays; a 3-second hold is the parents' hidden stop
  (function () {
    var play = document.getElementById("play-song");
    var pressTimer = null, longPressed = false;
    play.addEventListener("pointerdown", function () {
      longPressed = false;
      pressTimer = setTimeout(function () { longPressed = true; stopPlayback(); }, 3000);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (evName) {
      play.addEventListener(evName, function () { clearTimeout(pressTimer); });
    });
    play.addEventListener("click", function () {
      if (longPressed) { longPressed = false; return; }
      playDaily();
    });
  })();

  document.getElementById("manage-songs").addEventListener("click", function () {
    var m = document.getElementById("song-manager");
    m.hidden = !m.hidden;
  });

  document.getElementById("song-list").addEventListener("click", function (ev) {
    if (!ev.target.classList.contains("del-song")) return;
    var li = ev.target.closest("li");
    var id = Number(li.getAttribute("data-id"));
    state.songs = state.songs.filter(function (s) { return s.id !== id; });
    renderSongs(); schedulePublish();
  });

  document.getElementById("add-song").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var urlInput = document.getElementById("song-url");
    var nameInput = document.getElementById("song-name");
    var vid = ytId(urlInput.value.trim());
    if (!vid) { note("הקישור לא נראה כמו קישור יוטיוב תקין."); return; }
    var maxId = state.songs.reduce(function (m, s) { return Math.max(m, s.id); }, 0);
    var title = nameInput.value.trim() || ("שיר " + (state.songs.length + 1));
    state.songs.push({ id: maxId + 1, videoId: vid, title: title });
    urlInput.value = ""; nameInput.value = "";
    note("");
    renderSongs(); schedulePublish();
  });

  /* ---------- boot ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    PRISTINE = document.documentElement.outerHTML;
    renderTasks();
    renderSongs();
    tick();
    initSlider();
    scheduleTick();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) tick(); // resync instantly when the screen wakes
    });
    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (ns) { artifactNS = ns; });
    }
    if (SB_ON) cloudInit();
    if (SHEET_ON) {
      document.getElementById("manage-songs").style.display = "none";
      document.getElementById("song-manager").hidden = true;
      refreshSheet();
      setInterval(refreshSheet, 600000); // re-read the sheet every 10 minutes
    }
  });
})();
</script>
