<title>לוּחַ בּוֹסְקוֹ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&display=swap">
<script type="application/json" id="state">{"tasks":[],"songs":[],"rev":1}</script>
<style>
  :root {
    --paper: #fcfcf9;
    --ink: #191914;
    --faint: #8a8a80;
    --hairline: #b9b9ae;
    --shade: #f1f0e9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Frank Ruhl Libre', 'David Libre', 'Times New Roman', serif;
    direction: rtl;
    overflow: hidden;
  }
  #board {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  /* ---- right pane: date, clock, tasks ---- */
  #now-pane {
    flex: 11;
    display: flex;
    flex-direction: column;
    padding: 3.5vmin 4vmin 3vmin 3vmin;
    border-left: 1px solid var(--hairline);
    min-width: 0;
  }
  #date-line {
    font-size: 2.6vmin;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  #clock {
    font-size: 10.5vmin;
    line-height: 1.18;
    font-weight: 900;
    margin-top: 1.2vmin;
    text-wrap: balance;
  }
  /* letter-level clock transitions */
  .w { display: inline-block; }
  .g { display: inline-block; }
  .g.out { animation: g-out 0.42s cubic-bezier(0.5, 0, 0.8, 0.4) forwards; }
  .g.in { animation: g-in 0.6s cubic-bezier(0.15, 0.6, 0.2, 1) backwards; }
  @keyframes g-out {
    to { opacity: 0; transform: translateY(-0.16em); filter: blur(3px); }
  }
  @keyframes g-in {
    from { opacity: 0; transform: translateY(0.18em); filter: blur(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .g.out, .g.in { animation: none; }
  }
  #tasks-block {
    margin-top: auto;
    padding-top: 2vmin;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: 58%;
  }
  #tasks-title {
    font-size: 3.4vmin;
    font-weight: 700;
    margin-bottom: 1.6vmin;
  }
  #task-list {
    list-style: none;
    overflow-y: auto;
    min-height: 0;
  }
  .task {
    display: flex;
    align-items: baseline;
    gap: 1.6vmin;
    padding: 0.9vmin 0;
    font-size: 2.8vmin;
    font-weight: 500;
  }
  .task .dot {
    flex: none;
    width: 2.4vmin; height: 2.4vmin;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    align-self: center;
    padding: 0;
  }
  .task.done .dot { background: var(--ink); }
  .task.done .txt { text-decoration: line-through; color: var(--faint); }
  .task .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task .del {
    flex: none;
    border: 0; background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 2.4vmin;
    cursor: pointer;
    visibility: hidden;
    align-self: center;
  }
  .task.done .del { visibility: visible; }
  #add-row {
    display: flex;
    gap: 1.2vmin;
    align-items: center;
    padding-top: 1.4vmin;
    margin-top: 0.6vmin;
    border-top: 1px solid var(--hairline);
  }
  #add-row select, #add-row input, #add-row button {
    font-family: inherit;
    font-size: 2.5vmin;
    color: var(--ink);
    background: var(--paper);
    border: 0;
  }
  #add-row select {
    border-bottom: 1px solid var(--hairline);
    padding: 0.4vmin 0;
  }
  #add-row input {
    flex: 1;
    min-width: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 0.4vmin 0.2vmin;
  }
  #add-row input:focus, #add-row select:focus { outline: none; border-bottom-color: var(--ink); }
  #add-row button {
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    width: 4vmin; height: 4vmin;
    line-height: 1;
    font-size: 3vmin;
    font-weight: 500;
    cursor: pointer;
  }
  #add-row button:focus-visible, .dot:focus-visible, .del:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* ---- song of the day ---- */
  #song-block { margin-top: 2.4vmin; }
  #song-row { display: flex; align-items: center; gap: 1.8vmin; }
  #play-song {
    width: 7vmin; height: 7vmin;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink);
    font-size: 3vmin;
    cursor: pointer;
    padding-right: 0.6vmin; /* optical centering of the triangle */
  }
  #play-song:active { background: var(--ink); color: var(--paper); }
  #song-label { font-size: 3vmin; font-weight: 700; }
  #manage-songs {
    border: 0; background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 3.2vmin;
    cursor: pointer;
    margin-right: auto;
  }
  #play-song:focus-visible, #manage-songs:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #song-manager { margin-top: 1vmin; }
  #song-list { list-style: none; max-height: 18vmin; overflow-y: auto; }
  #song-list li {
    display: flex; align-items: center; gap: 1.2vmin;
    font-size: 2.3vmin; padding: 0.4vmin 0; color: var(--ink);
  }
  #song-list .del-song {
    border: 0; background: none; color: var(--faint);
    font-family: inherit; font-size: 2.2vmin; cursor: pointer;
  }
  #add-song { display: flex; gap: 1.2vmin; align-items: center; margin-top: 0.6vmin; }
  #add-song input {
    font-family: inherit; font-size: 2.2vmin; color: var(--ink);
    background: var(--paper); border: 0;
    border-bottom: 1px solid var(--hairline);
    padding: 0.3vmin 0.2vmin; min-width: 0;
  }
  #add-song #song-url { flex: 3; direction: ltr; text-align: left; }
  #add-song #song-name { flex: 2; }
  #add-song button {
    font-family: inherit; font-size: 2.6vmin; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 50%; width: 3.4vmin; height: 3.4vmin; line-height: 1; cursor: pointer;
  }
  #add-song input:focus { outline: none; border-bottom-color: var(--ink); }
  #note {
    font-size: 1.9vmin;
    color: var(--faint);
    margin-top: 1vmin;
    min-height: 2.4vmin;
  }
  /* ---- embedded player ---- */
  #player-overlay[hidden] { display: none; }
  #player-overlay {
    position: fixed; inset: 0;
    background: rgba(25, 25, 20, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #player-box {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    width: min(88vw, 150vmin);
    max-width: 900px;
    padding: 2vmin;
  }
  #player-frame-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--shade);
  }
  #player-frame-wrap iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  #player-bar {
    display: flex; align-items: center; gap: 2vmin;
    margin-top: 1.4vmin;
  }
  #player-title { font-weight: 700; font-size: 2.8vmin; flex: 1; min-width: 0; }
  #player-bar button {
    font-family: inherit; font-size: 2.3vmin;
    color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 0.5vmin 1.6vmin;
    cursor: pointer;
  }
  #player-bar button:active { background: var(--ink); color: var(--paper); }
  #open-yt { font-size: 1.9vmin; color: var(--faint); }
  #player-bar button:focus-visible, #open-yt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* ---- left pane: schedule ---- */
  #schedule-pane {
    flex: 14;
    padding: 3.5vmin 3vmin 1.5vmin;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  /* weekly slider */
  #slider {
    flex: 1;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    min-height: 0;
  }
  #slider::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    min-width: 0;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
  }
  .weekly-title {
    font-size: 2.9vmin;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.2vmin;
  }
  .weekly-wrap { flex: 1; min-height: 0; display: flex; }
  table.weekly {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .weekly th, .weekly td {
    border: 1px solid var(--hairline);
    text-align: center;
    vertical-align: middle;
    font-size: 1.8vmin;
    font-weight: 500;
    padding: 0.5vmin 0.2vmin;
    overflow: hidden;
  }
  .weekly th { font-size: 2vmin; font-weight: 700; }
  .weekly .hr { width: 8%; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 400; }
  .weekly .today-col { background: var(--shade); }
  .weekly-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hairline);
    color: var(--faint);
    font-size: 2.8vmin;
    text-align: center;
    padding: 2vmin;
  }
  #slider-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.4vmin;
    padding-top: 1vmin;
  }
  #slider-nav button {
    border: 0;
    background: none;
    color: var(--faint);
    font-family: inherit;
    font-size: 3.6vmin;
    line-height: 1;
    cursor: pointer;
    padding: 0 1vmin;
  }
  #slider-nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #slider-dots { display: flex; gap: 1.4vmin; }
  .sdot {
    width: 1.3vmin; height: 1.3vmin;
    border: 1px solid var(--faint);
    border-radius: 50%;
  }
  .sdot.on { background: var(--ink); border-color: var(--ink); }
  #schedule {
    flex: 1;
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  #schedule th, #schedule td {
    border: 1px solid var(--hairline);
    text-align: center;
    vertical-align: middle;
    padding: 0.6vmin 0.5vmin;
    font-size: 2.4vmin;
    font-weight: 500;
    overflow: hidden;
  }
  #schedule th {
    font-size: 2.9vmin;
    font-weight: 700;
    padding: 1vmin 0.5vmin;
  }
  #schedule .hourcol {
    width: 24%;
    font-weight: 400;
  }
  #schedule .hourcol .hname { display: block; font-weight: 500; }
  #schedule .hourcol .htime {
    display: block;
    font-size: 1.9vmin;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    direction: ltr;
  }
  #schedule tr.break td { background: var(--shade); font-size: 2vmin; padding: 0.4vmin; }
  #schedule tr.after td { height: 16%; font-weight: 400; color: var(--faint); }
  #schedule td.empty { color: var(--faint); }
  #offday {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
    border: 1px solid var(--hairline);
  }
  #offday-word { font-size: 11vmin; font-weight: 900; }
  #offday-sub { font-size: 3vmin; font-weight: 400; color: var(--faint); }
  /* portrait / phone: stacked, scrollable, sized by width */
  @media (orientation: portrait) {
    html, body { height: auto; }
    body { overflow: auto; }
    #board { flex-direction: column; height: auto; min-height: 100vh; width: auto; }
    #now-pane {
      border-left: 0;
      border-bottom: 1px solid var(--hairline);
      padding: 5vw 5vw 6vw;
    }
    #date-line { font-size: 4.2vw; }
    #clock { font-size: 12vw; }
    #song-block { margin-top: 5vw; }
    #song-row { gap: 3vw; }
    #play-song { width: 11vw; height: 11vw; font-size: 4.6vw; padding-right: 1vw; }
    #song-label { font-size: 5vw; }
    #manage-songs { font-size: 5.5vw; }
    #song-manager { margin-top: 2vw; }
    #song-list { max-height: 34vw; }
    #song-list li { font-size: 4vw; gap: 2vw; padding: 1vw 0; }
    #song-list .del-song { font-size: 4vw; }
    #add-song { gap: 2vw; margin-top: 1.5vw; }
    #add-song input { font-size: 4vw; padding: 0.8vw 0.4vw; }
    #add-song button { font-size: 4.6vw; width: 6.5vw; height: 6.5vw; }
    #tasks-block { max-height: none; margin-top: 7vw; padding-top: 0; }
    #tasks-title { font-size: 5.5vw; margin-bottom: 2.5vw; }
    #task-list { overflow-y: visible; }
    .task { font-size: 4.6vw; gap: 3vw; padding: 1.6vw 0; }
    .task .dot { width: 4.4vw; height: 4.4vw; }
    .task .del { font-size: 4vw; }
    #add-row { gap: 2.5vw; padding-top: 2.5vw; }
    #add-row select, #add-row input { font-size: 4.2vw; padding: 0.8vw 0.4vw; }
    #add-row button { width: 7.5vw; height: 7.5vw; font-size: 5.5vw; }
    #note { font-size: 3.4vw; min-height: 4.5vw; }
    #schedule-pane { padding: 5vw 4vw 6vw; }
    #schedule th { font-size: 4.6vw; padding: 2vw 1vw; }
    #schedule th.hourcol, #schedule td.hourcol { width: 28%; }
    #schedule td { font-size: 3.9vw; padding: 1.8vw 1vw; }
    #schedule .hourcol .htime { font-size: 3vw; }
    #schedule tr.break td { font-size: 3.2vw; padding: 1.2vw 1vw; }
    #schedule tr.after td { height: auto; padding: 4vw 1vw; }
    #offday { min-height: 60vw; }
    #offday-word { font-size: 14vw; }
    #offday-sub { font-size: 4.4vw; }
    .weekly-title { font-size: 5vw; margin-bottom: 2vw; }
    .weekly th, .weekly td { font-size: 2.9vw; padding: 1.2vw 0.4vw; }
    .weekly th { font-size: 3.2vw; }
    .weekly .hr { font-size: 2.4vw; }
    .weekly-empty { min-height: 50vw; font-size: 4.4vw; }
    #slider-nav { gap: 5vw; padding-top: 2.5vw; }
    #slider-nav button { font-size: 7vw; }
    .sdot { width: 2.4vw; height: 2.4vw; }
    #player-bar button { font-size: 4vw; padding: 1vw 3vw; }
    #player-title { font-size: 4.6vw; }
    #open-yt { font-size: 3.4vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .task .dot { transition: background 0.15s; }
  }
</style>

<div id="board">
  <main id="now-pane">
    <div id="date-line">—</div>
    <div id="clock">—</div>
    <section id="song-block">
      <div id="song-row">
        <button id="play-song" aria-label="נגינת שיר אקראי מרשימת שיר היום">▶</button>
        <span id="song-label">שִׁיר הַיּוֹם</span>
        <button id="manage-songs" aria-label="ניהול רשימת השירים">+</button>
      </div>
      <div id="song-manager" hidden>
        <ul id="song-list"></ul>
        <form id="add-song">
          <input id="song-url" type="url" placeholder="הדביקו קישור יוטיוב" aria-label="קישור יוטיוב" required>
          <input id="song-name" type="text" placeholder="שם השיר" aria-label="שם השיר" maxlength="60">
          <button type="submit" aria-label="הוספת שיר">+</button>
        </form>
      </div>
    </section>
    <section id="tasks-block">
      <div id="tasks-title">מְשִׂימוֹת לְהַיּוֹם:</div>
      <ul id="task-list"></ul>
      <form id="add-row">
        <select id="who" aria-label="מי">
          <option>גולי</option>
          <option>אורי</option>
          <option>שי</option>
          <option>אמא</option>
          <option>אבא</option>
          <option>כולם</option>
        </select>
        <input id="what" type="text" placeholder="משימה חדשה" aria-label="משימה חדשה" maxlength="80">
        <button type="submit" aria-label="הוספת משימה">+</button>
      </form>
      <div id="note"></div>
    </section>
  </main>
  <aside id="schedule-pane">
    <div id="slider">
      <section class="slide" id="slide-guli">
        <div class="weekly-title">הַשָּׁבוּעַ שֶׁל גּוֹלִי</div>
        <div class="weekly-wrap" id="weekly-guli"></div>
      </section>
      <section class="slide" id="slide-today">
        <table id="schedule" aria-label="מערכת השעות של היום">
          <thead>
            <tr><th style="width:38%">גּוֹלִי</th><th class="hourcol">שָׁעָה</th><th style="width:38%">אוֹרִי</th></tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
        <div id="offday"><div id="offday-word">—</div><div id="offday-sub"></div></div>
      </section>
      <section class="slide" id="slide-ori">
        <div class="weekly-title">הַשָּׁבוּעַ שֶׁל אוֹרִי</div>
        <div class="weekly-wrap" id="weekly-ori"></div>
      </section>
    </div>
    <div id="slider-nav">
      <button id="nav-right" aria-label="הַשָּׁבוּעַ שֶׁל גּוֹלִי">›</button>
      <div id="slider-dots"><span class="sdot" data-i="0"></span><span class="sdot on" data-i="1"></span><span class="sdot" data-i="2"></span></div>
      <button id="nav-left" aria-label="הַשָּׁבוּעַ שֶׁל אוֹרִי">‹</button>
    </div>
  </aside>
</div>

<div id="player-overlay" hidden>
  <div id="player-box">
    <div id="player-frame-wrap"></div>
    <div id="player-bar">
      <span id="player-title"></span>
      <a id="open-yt" target="_blank" rel="noopener">לא מתנגן? פתיחה ביוטיוב</a>
      <button id="next-song" type="button">שיר אחר</button>
      <button id="close-player" type="button" aria-label="סגירת הנגן">✕</button>
    </div>
  </div>
</div>

      var remoteHas = remote.tasks.length || remote.songs.length;
      if (!remoteHas && localHas) { state.rev = remote.rev + 1; cloudPush(); } // first device migrates its data up
      else if (JSON.stringify(remote) !== JSON.stringify(state)) adoptRemote(remote);
    }).catch(function () { /* offline: stay local */ });
    setInterval(function () {
      if (publishTimer) return; // a local edit is about to be pushed
      cloudPull().then(function (remote) {
        if (remote && remote.rev !== state.rev) adoptRemote(remote);
      }).catch(function () { /* offline */ });
    }, 15000);
  }

  function renderTasks() {
    var ul = document.getElementById("task-list");
    ul.innerHTML = state.tasks.map(function (t) {
      return "<li class='task" + (t.done ? " done" : "") + "' data-id='" + t.id + "'>" +
        "<button class='dot' aria-label='סימון ביצוע'></button>" +
        "<span class='txt'>" + esc(t.who) + " - " + esc(t.text) + "</span>" +
        "<button class='del' aria-label='מחיקה'>✕</button></li>";
    }).join("");
  }

  function note(msg) { document.getElementById("note").textContent = msg || ""; }

  var publishTimer = null;
  function schedulePublish() {
    if (publishTimer) clearTimeout(publishTimer);
    publishTimer = setTimeout(doPublish, 900);
  }
  function doPublish() {
    publishTimer = null;
    if (!IS_ARTIFACT) {
      state.rev = (state.rev || 0) + 1;
      saveLocal();
      if (SB_ON) cloudPush();
      return;
    }
    if (!PRISTINE) return;
    if (!artifactNS) { note("השינוי נשמר רק במסך הזה. פתחו את הלוח מחשבון עם הרשאת עריכה כדי לשמור לכולם."); return; }
    state.rev = (state.rev || 0) + 1;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    var doc = PRISTINE.replace(/<script type="application\/json" id="state">[\s\S]*?<\/script>/,
      function () { return '<script type="application/json" id="state">' + json + "<\/script>"; });
    artifactNS.publish("<!DOCTYPE html>\n" + doc).catch(function (e) {
      if (e && e.code === "conflict") return; // someone else published; view reloads to the winner
      canWrite = false;
      note("אין הרשאת שמירה מהמכשיר הזה. השינוי נשאר רק במסך הזה.");
    });
  }

  document.getElementById("task-list").addEventListener("click", function (ev) {
    var li = ev.target.closest(".task");
    if (!li) return;
    var id = Number(li.getAttribute("data-id"));
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    if (ev.target.classList.contains("dot")) { t.done = !t.done; renderTasks(); schedulePublish(); }
    if (ev.target.classList.contains("del")) {
      state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
      renderTasks(); schedulePublish();
    }
  });

  document.getElementById("add-row").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("what");
    var text = input.value.trim();
    if (!text) return;
    var who = document.getElementById("who").value;
    var maxId = state.tasks.reduce(function (m, t) { return Math.max(m, t.id); }, 0);
    state.tasks.push({ id: maxId + 1, who: who, text: text, done: false });
    input.value = "";
    renderTasks(); schedulePublish();
  });

  /* ---------- song of the day ---------- */
  state.songs = state.songs || [];
  var lastPlayedId = null;

  function ytId(url) {
    var m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function renderSongs() {
    var ul = document.getElementById("song-list");
    ul.innerHTML = state.songs.length
      ? state.songs.map(function (s) {
          return "<li data-id='" + s.id + "'><button class='del-song' aria-label='הסרת שיר'>✕</button><span>" + esc(s.title) + "</span></li>";
        }).join("")
      : "<li>הרשימה ריקה. הדביקו למטה קישור יוטיוב.</li>";
  }

  function showPlayer(song) {
    lastPlayedId = song.id;
    document.getElementById("player-title").textContent = song.title;
    document.getElementById("open-yt").href = "https://www.youtube.com/watch?v=" + song.videoId;
    document.getElementById("player-frame-wrap").innerHTML =
      "<iframe src='https://www.youtube-nocookie.com/embed/" + song.videoId +
      "?autoplay=1&rel=0' allow='autoplay; encrypted-media; fullscreen' title='" + esc(song.title) + "'></iframe>";
    document.getElementById("player-overlay").hidden = false;
  }

  function closePlayer() {
    document.getElementById("player-overlay").hidden = true;
    document.getElementById("player-frame-wrap").innerHTML = "";
  }

  function playRandom() {
    if (!state.songs.length) {
      document.getElementById("song-manager").hidden = false;
      note("עוד אין שירים ברשימה. הוסיפו קישור יוטיוב ולחצו שוב על פליי.");
      return;
    }
    var pool = state.songs.length > 1
      ? state.songs.filter(function (s) { return s.id !== lastPlayedId; })
      : state.songs;
    showPlayer(pool[Math.floor(Math.random() * pool.length)]);
  }

  document.getElementById("play-song").addEventListener("click", playRandom);
  document.getElementById("next-song").addEventListener("click", playRandom);
  document.getElementById("close-player").addEventListener("click", closePlayer);
  document.getElementById("player-overlay").addEventListener("click", function (ev) {
    if (ev.target === this) closePlayer();
  });

  document.getElementById("manage-songs").addEventListener("click", function () {
    var m = document.getElementById("song-manager");
    m.hidden = !m.hidden;
  });

  document.getElementById("song-list").addEventListener("click", function (ev) {
    if (!ev.target.classList.contains("del-song")) return;
    var li = ev.target.closest("li");
    var id = Number(li.getAttribute("data-id"));
    state.songs = state.songs.filter(function (s) { return s.id !== id; });
    renderSongs(); schedulePublish();
  });

  document.getElementById("add-song").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var urlInput = document.getElementById("song-url");
    var nameInput = document.getElementById("song-name");
    var vid = ytId(urlInput.value.trim());
    if (!vid) { note("הקישור לא נראה כמו קישור יוטיוב תקין."); return; }
    var maxId = state.songs.reduce(function (m, s) { return Math.max(m, s.id); }, 0);
    var title = nameInput.value.trim() || ("שיר " + (state.songs.length + 1));
    state.songs.push({ id: maxId + 1, videoId: vid, title: title });
    urlInput.value = ""; nameInput.value = "";
    note("");
    renderSongs(); schedulePublish();
  });

  /* ---------- boot ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    PRISTINE = document.documentElement.outerHTML;
    renderTasks();
    renderSongs();
    tick();
    initSlider();
    scheduleTick();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) tick(); // resync instantly when the screen wakes
    });
    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (ns) { artifactNS = ns; });
    }
    if (SB_ON) cloudInit();
  });
})();
</script>
